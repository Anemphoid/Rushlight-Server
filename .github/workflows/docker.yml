# The Rushlight server as a container image.
#   - On a pull request that changes the image or the server: build it and run docker/smoke-test.sh. Nothing is published.
#   - On a version tag (vX.Y.Z): test the image for ordinary computers (amd64) AND Raspberry Pi (arm64), and only then publish
#     both to GitHub's container registry as ghcr.io/anemphoid/rushlight-server:vX.Y.Z (plus X.Y, and "stable" for a release).
# After the first publish, make the package public once: GitHub > your profile > Packages > rushlight-server > Package settings
# > Change visibility. (The registry makes new packages private.)
name: Docker image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - deploy/**
      - .github/workflows/docker.yml
      - package.json
      - package-lock.json
      - src/**
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/anemphoid/rushlight-server
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for ordinary computers (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rushlight-server:test-amd64
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Smoke test (amd64)
        run: docker/smoke-test.sh rushlight-server:test-amd64 "${{ steps.v.outputs.version }}" linux/amd64

      # The whole stack, as a person runs it: deploy/rushlight setup, the real LiveKit from Docker Hub, and two clients
      # (the server's own @livekit/rtc-node) of which one must hear the other's tone.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Stack test (setup, check, voice between two people, restart, a broken stack)
        run: docker/stack-test.sh rushlight-server:test-amd64
      - name: Public mode test (Caddy in front, a name pointing here, voice, LiveKit closed to the network)
        run: docker/stack-test-public.sh rushlight-server:test-amd64
      - name: Tailscale mode test (files, where the key goes, a wrong key; the real sign-in only if a TS_TEST_AUTHKEY secret exists)
        env:
          TS_TEST_AUTHKEY: ${{ secrets.TS_TEST_AUTHKEY }}
        run: docker/stack-test-tailscale.sh rushlight-server:test-amd64

      - name: Build for Raspberry Pi (arm64)
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: rushlight-server:test-arm64
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Smoke test (arm64, under emulation)
        if: github.ref_type == 'tag'
        run: docker/smoke-test.sh rushlight-server:test-arm64 "${{ steps.v.outputs.version }}" linux/arm64

      - name: Sign in to the registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image names
        if: github.ref_type == 'tag'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish (both kinds of computer)
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
